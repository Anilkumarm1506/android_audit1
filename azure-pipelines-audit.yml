trigger: none # run manually (audit)

pool:
  vmImage: ubuntu-latest

steps:
  # 1) Checkout the GitHub repo
  - checkout: self
    fetchDepth: 1

  # 2) Run the audit script
  - bash: |
      set -euo pipefail

      echo "Repo root: $(Build.SourcesDirectory)"
      cd "$(Build.SourcesDirectory)"

      echo "Make script executable..."
      chmod +x tools/bd_detect_audit_v2.sh

      echo "Run audit..."
      ./tools/bd_detect_audit_v2.sh . bd_detect_audit_v2.csv

      echo "Preview CSV (first 30 lines):"
      head -n 30 bd_detect_audit_v2.csv || true
    displayName: "Run Detect/Black Duck Audit (v2)"

  # 3) Publish CSV as artifact
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.SourcesDirectory)/bd_detect_audit_v2.csv'
      artifact: 'bd-detect-audit-v2'
      publishLocation: 'pipeline'
    displayName: "Publish audit report"
