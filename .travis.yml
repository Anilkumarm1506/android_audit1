language: node_js
node_js:
  - "18"

env:
  global:
    - POLARIS_SERVER_URL=__set_in_travis_env__
    - POLARIS_ACCESS_TOKEN=__set_in_travis_env__

install:
  - npm ci

script:
  - set -euo pipefail
  - mkdir -p .ci-tools
  - echo "Download bridge-cli to .ci-tools/bridge"
  - chmod +x .ci-tools/bridge || true
  - .ci-tools/bridge --stage polaris --input bridge.yml
