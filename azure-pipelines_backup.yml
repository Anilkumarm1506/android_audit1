trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  # ------------------------------------------------------------
  # Synopsys Polaris SAST integration (task-based / plugin style)
  # This mirrors real-world Synopsys / Black Duck ADO extensions
  # ------------------------------------------------------------
  - task: SynopsysSecurityScan@1
    displayName: "Synopsys Polaris SAST Scan"
    inputs:
      scanType: 'polaris'
      polarisService: 'https://yourorg.polaris.synopsys.com'
      projectName: 'juice-shop'
      branchName: '$(Build.SourceBranchName)'
      waitForScan: true

  # Optional: result handling step (common in real pipelines)
  - task: PublishBuildArtifacts@1
    displayName: "Publish Polaris Results (POC)"
    inputs:
      pathToPublish: '$(Build.SourcesDirectory)'
      artifactName: 'polaris-results'
