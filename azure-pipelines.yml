trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  COVERITY_HOME: /opt/coverity
  COVERITY_IDIR: $(Build.SourcesDirectory)/idir

steps:
  - checkout: self

  # ------------------------------------------------------------
  # Synopsys Coverity CLI SAST integration (direct invocation)
  # ------------------------------------------------------------
  - bash: |
      echo "Starting Coverity SAST scan"

      echo "cov-build --dir $(COVERITY_IDIR) npm run build"
      echo "cov-analyze --dir $(COVERITY_IDIR) --all"
      echo "cov-commit-defects --dir $(COVERITY_IDIR) \
            --url https://coverity.example.com \
            --stream juice-shop-main"

    displayName: "Coverity SAST Scan (CLI)"

  # Optional: artifact publish (very common)
  - task: PublishBuildArtifacts@1
    displayName: "Publish Coverity Analysis Artifacts (POC)"
    inputs:
      pathToPublish: '$(COVERITY_IDIR)'
      artifactName: 'coverity-idir'
