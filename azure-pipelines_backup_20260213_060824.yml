trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  # ------------------------------------------------------------
  # Synopsys Bridge: Coverity on Polaris (SAST)
  # Using direct URL and token (hardcoded) per your request.
  # ------------------------------------------------------------
  - task: SynopsysBridge@1
    displayName: "Black Duck Coverity on Polaris (SAST)"
    inputs:
      bridge_build_type: "polaris"
      polaris_server_url: "https://polaris.test-example.com"   # <-- actual URL
      polaris_access_token: "$(POLARIS_TOKEN)"     # <-- actual token
      polaris_project_name: "$(Build.Repository.Name)"
      polaris_branch_name: "$(Build.SourceBranchName)"

  # Optional: publish artifacts (if you still want it)
  - task: PublishBuildArtifacts@1
    displayName: "Publish Polaris Results (POC)"
    inputs:
      pathToPublish: '$(Build.SourcesDirectory)'
      artifactName: 'polaris-results'
